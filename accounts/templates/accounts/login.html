{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block page_title %}Sign in{% endblock %}
{% block content %}
<div class="panel mx-auto" style="max-width: 540px;">
    <div class="eyebrow">Secure access</div>
    <h2 class="mt-2">Login</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <a href="{% url 'accounts:password_reset' %}" class="d-inline-block mt-3 small">Forgot your password?</a>
</div>
{% endblock %}
