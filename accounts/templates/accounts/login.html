{% extends 'base_public.html' %}
{% block title %}Login{% endblock %}
{% block page_title %}Sign in{% endblock %}
{% block content %}
<div class="panel auth-card">
    <div class="eyebrow">Secure access</div>
    <h2 class="mt-2">Login</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <div class="d-flex justify-content-between flex-wrap gap-2 mt-3 small">
        <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
        <a href="{% url 'accounts:register' %}">Create an account</a>
    </div>
</div>
{% endblock %}
