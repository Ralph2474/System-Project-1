{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Internship & OJT Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>
<div class="public-shell">
    <header class="public-topbar">
        <div class="public-brand">
            <div class="brand-mark">OJT</div>
            <div>
                <div class="brand-text">Internship & OJT</div>
            </div>
        </div>
        <div class="public-actions">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-outline-primary">Create account</a>
        </div>
    </header>

    <main class="public-main">
        {% if messages %}
            <div class="flash-stack public-flash" aria-live="polite">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}" role="status">
                        <i class="bi bi-info-circle me-2" aria-hidden="true"></i>{{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <div class="page-footer public-footer">
        <span>Academic OJT Office</span>
        <span>•</span>
        <span>Trusted workflow records</span>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
